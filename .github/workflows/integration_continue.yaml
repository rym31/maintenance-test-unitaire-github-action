# Le on specifie a quel moment le workflow doit s'executer. Ici, il s'executera a chaque push sur le repository.
name: Compilation du projet atelier-test-unitaires
on:
    push:
#Les jobs sont les differentes etspe du workflow.
jobs:
    #Nom du premier job. Ici, il s'agit de la compilation du projet.
    compilation:
        runs-on: ubuntu-latest
        #Definition des etapes du job.
        steps:
            - name: Va cherhcer le code source du projet
              uses: actions/checkout@v5
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:                          # ...paramétrée par des entrées (`with:`)
                java-version: '25'
                distribution: 'temurin'
            - name: Compile le projet
              run: ./mvnw compile